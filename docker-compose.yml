name: zafir-carousel

services:
  zafir-analytics-carousel:
    build:
      context: .
      # VITE_* se hornean en el bundle (build time). En produccion apuntalas a la
      # URL publica de Strapi/realtime.
      args:
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1340}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:9001}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
    container_name: zafir-analytics-carousel-dev
    restart: unless-stopped
    ports:
      - "${CAROUSEL_HOST_PORT:-5175}:3001"
